# =============================================================================
#  Diamond Engine — build environment
# =============================================================================
#  Everything here is tuned for "small, fast, buildable anywhere".
#  The values can be overridden from the command line with -Pdiamond.<name>=…
# =============================================================================

# --- Toolchain (overridden by the CI matrix / fallback retry) ---------------
diamondAgpVersion=9.0.1
diamond.ndk.version=30.0.16248370
diamond.cmake.version=3.31.5
diamond.use_luac=1
diamond.spv=0

# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.warning.mode=summary

# --- Android ----------------------------------------------------------------
# No AndroidX and no Jetifier: the app is plain Java + framework views, which
# keeps the Kotlin stdlib out of the APK.
android.useAndroidX=false
android.enableJetifier=false
# Non-transitive R classes make incremental builds cheaper.
android.nonTransitiveRClass=true
# Per-feature defaults (android.defaults.buildfeatures.*) are deliberately NOT
# set: AGP 9 rejects them outright as removed options, and buildFeatures in
# app/build.gradle already declares exactly the same thing in a supported way.
