# =============================================================================
#  Diamond Engine — build environment
# =============================================================================
#  Everything here is tuned for "small, fast, buildable anywhere".
#  The values can be overridden from the command line with -Pdiamond.<name>=…
# =============================================================================

# --- Toolchain (overridden by the CI matrix / fallback retry) ---------------
diamondAgpVersion=9.0.1
diamond.ndk.version=30.0.16248370
diamond.cmake.version=3.31.5
diamond.use_luac=1
diamond.spv=0

# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.warning.mode=summary

# --- Android ----------------------------------------------------------------
android.useAndroidX=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.enableJetifier=false
